version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # One batch a month. Security updates still open as soon as an alert lands.
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # All security fixes in one PR instead of one per package.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # All minor and patch bumps in one PR. Majors still open on their own.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Major versions of these are reviewed by hand.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 breaks eslint-plugin-react (via eslint-config-next).
      # Re-enable when eslint-config-next ships ESLint 10 support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "github-actions"
      - "automated"
    groups:
      actions:
        patterns:
          - "*"
